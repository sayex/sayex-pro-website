version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait before proposing a new release, so a broken or compromised version has
    # time to be caught and pulled from the registry first.
    cooldown:
      default-days: 7
      semver-major-days: 30
    commit-message:
      prefix: chore
      include: scope
    # One PR for all minor and patch bumps; each major version gets its own PR.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']
